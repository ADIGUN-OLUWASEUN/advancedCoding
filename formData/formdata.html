<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formData</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
         .container{
            width: 100%;
            height: 60vh;
            margin: auto;
        }
        h1{
            text-align: center;
        }
        label{
            margin-left: 5%;
        }
        input{
            width: 80%;
            height: 25px;
            margin-left: 5%;
        }
        select{
            width: 80%;
            height: 25px;
            margin-left: 5%;
        }
    
        button{
            margin-left: 6%;
            width: 7%;
            height: 40px;
            border-radius: 5px;
            background-color: blue;
            color: white;
            border: none;
        }
        #dataDisplayTable {
            margin-top: 20px;
        }
        #dataDisplayTable .table {
            width: 100%;
        }
        #displayTable button{
            color: aqua;
            width: 25%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Information Table</h1>

        <label for="name">Name</label> <br>
        <input type="text" id="name" placeholder="Enter Your Name"> <br><br>

        <label for="age">Age</label> <br>
        <input type="number" id="age" min="0" placeholder="Enter Your Age"> <br><br>

        <label for="Gender">Gender</label> <br>
        <select id="gender">
            <option value="choose">choose a gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select> <br><br>

        <button onclick="submitData()">SUBMIT</button> <br>

        <label for="search">Search</label> <br>
        <input type="text" id="search" placeholder="Search name/age/gender" oninput="searchName()">


       
        <div id="dataDisplayTable">
            <table class="table  table-striped">
                <thead>
                    <tr>
                        <th scope="col">S/N</th>
                        <th scope="col">NAME</th>
                        <th scope="col">AGE</th>
                        <th scope="col">GENDER</th>
                        <th scope="col" style="padding-left: 10%;">ACTION</th>
                    </tr>
                </thead>


                <tbody id="displayTable"></tbody>
            </table>

            <p style="color: brown;" id="resultSearch"></p>
        </div>

       



    </div>

    <script src="./formdata.js"></script>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
