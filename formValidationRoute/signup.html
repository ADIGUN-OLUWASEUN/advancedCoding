<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIGNUP</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <label for="fullName">FULL-NAME : </label>
      <input type="text" id="fullname" placeholder="Enter your full-Name..." />

      <label for="phoneNum">PHONE NUMBER : </label>
      <input
        type="number"
        id="phoneNum"
        placeholder="Enter your phone number..."
      />

      <label for="usermail">E-MAIL : </label>
      <input type="email" id="mail" placeholder="Enter your mail..." />

      <label for="userpassword1">PASSWORD : </label>
      <input
        type="password"
        id="Password1"
        placeholder="Enter your password..."
      />
      <img src="eye-close.png" alt="" id="eyeicon" />

      <label for="userpassword2">CONFIRM PASSWORD : </label>
      <input
        type="password"
        id="Password2"
        placeholder="Enter your password..."
      />
      <img src="eye-close.png" alt="" id="eyeicon2" />

      <div>
        <button id="signIn">CREATE ACCOUNT</button>
        <button id="login">LOG IN</button>
      </div>
    </div>
  </body>
  <script src="./general.js"></script>
</html>
