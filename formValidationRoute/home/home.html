<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOME</title>
    <!-- <link rel="stylesheet" href="../style.css"> -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: rgb(164, 164, 173);
        font-weight: bolder;
      }
      h3 {
        text-align: center;
      }
      .container {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #dataDisplayTable {
        margin-top: 20px;
      }
      #dataDisplayTable .table {
        width: 100%;
      }
      #displayTable button {
        color: aqua;
        width: 90%;
      }
      #demo {
        color: red;
        margin-left: 25%;
      }
      .topper {
        display: flex;
        justify-content: space-evenly;
        margin-top: 2%;
        background-color: bisque;
      }
      .topper button {
        background-color: brown;
        color: whitesmoke;
        cursor: pointer;
      }
      h1 {
        text-align: center;
        color: darkgreen;
      }
    </style>
  </head>
  <body>
    <h1>WELCOME TO ADMIN PAGE</h1>

    <div class="topper">
      <button id="goToSignIn">LOG OUT</button>

      <div>
        <label for="searchUser">Search User Details</label>
        <input
          type="text"
          id="searchUser"
          placeholder="Search user details"
          oninput="searchAccount()"
        />
      </div>
    </div>

    <div id="dataDisplayTable">
      <table class="table table-striped">
        <thead>
          <tr class="position">
            <th scope="col">S/N</th>
            <th scope="col">FULL NAME</th>
            <th scope="col">PHONE NUMBER</th>
            <th scope="col">E-MAIL ADDRESS</th>
            <th scope="col">PASSWORD</th>
            <th scope="col">ACTION</th>
          </tr>
        </thead>

        <tbody id="displayTable"></tbody>
      </table>

      <p style="color: brown; background: white" id="resultSearch"></p>
    </div>

    <script src="../general.js"></script>
  </body>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</html>
